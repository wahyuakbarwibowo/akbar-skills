name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC: npm mints a short-lived token, no secret stored
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # no registry-url: it writes an .npmrc _authToken that is empty here,
          # and npm then skips the OIDC exchange and publishes unauthenticated (404).
      - run: npm install -g npm@latest   # trusted publishing needs npm >= 11.5.1
      - run: npm publish --access public
